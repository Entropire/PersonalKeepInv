name: PersonalKeepInv
version: '${version}'
main: dev.entropire.personalkeepinv.PersonalKeepInv
api-version: '1.13'
folia-supported: true

permissions:
  keepinv.use:
    description: Allows players to manage their personal KeepInv
    default: true
  keepinv.admin:
    description: Allows changing the global default keepInv gamerule
    default: op

commands:
  keepinv:
    description: Manage KeepInv settings
    usage: /keepinv [on|off|global|default [on|off]]
    permission: keepinv.use